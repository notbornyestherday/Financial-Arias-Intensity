[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fai"
version = "0.1.0"
description = "Financial Arias Intensity: does how intraday volatility is delivered carry information beyond realized variance?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pyarrow>=14",
    "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
notebook = ["jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
